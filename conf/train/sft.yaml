# Optional warm-up on the chosen responses only.
method: sft
learning_rate: 2.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
max_length: 1024

# Same pair selection as DPO (see conf/train/dpo.yaml); SFT trains on the chosen replies.
pairs:
  run_name: default
  wrong_per_correct: 3
  prefer_sampled_chosen: true
