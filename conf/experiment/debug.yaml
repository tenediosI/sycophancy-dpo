# @package _global_
# Tiny end-to-end run on a laptop CPU to check the code works: python run.py experiment=debug stage=...
defaults:
  - override /model: qwen2.5-0.5b-instruct

data:
  limit: 20

# Debug outputs are throwaway.
overwrite: true

eval:
  run_name: debug
  batch_size: 4
  n_bootstrap: 200
  spot_check_n: 10

capability:
  run_name: debug
  tasks:
    mmlu: 1             # 57 questions
    gsm8k: 5
    ifeval: 5
  gen_kwargs: {max_gen_toks: 128}
  batch_size: 4
  bootstrap_iters: 100

generate:
  run_name: debug
  turn1:
    n_samples: 2
  turn3:
    n_samples: 3
  max_new_tokens: 128
  batch_size: 8
  spot_check_n: 10
